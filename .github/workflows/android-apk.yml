name: 构建并发布安卓 APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取并检查标签更新明细
        if: startsWith(github.ref, 'refs/tags/')
        id: tag_notes
        run: |
          BODY="$(git tag -l --format='%(body)' "${GITHUB_REF_NAME}")"
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "标签 ${GITHUB_REF_NAME} 没有更新明细，已停止发布。请使用带正文的附注标签。" >&2
            exit 1
          fi
          {
            echo 'release_body<<EOF'
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm ci

      - name: 同步网页与 Capacitor 安卓工程
        run: npm run cap:sync

      - name: 构建 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: company-ledger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布 APK 到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 公司记账 ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          body: ${{ steps.tag_notes.outputs.release_body }}
          fail_on_unmatched_files: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
