<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公司记账</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M7 10c6 0 10 1.8 14 1.8S29 10 35 10v28c-6 0-10 1.8-14 1.8S13 38 7 38V10z' fill='%232E8B57'/%3E%3Cpath d='M24 11v29' stroke='%23fff' stroke-width='2' fill='none'/%3E%3Cpath d='M10 18h11M10 24h11M10 30h11M27 18h11M27 24h11M27 30h11' stroke='%23fff' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#3B53D9; --primary-d:#2F44B8;
  --bg:#F4F5F9; --panel:#FFFFFF; --border:#E5E7F0;
  --text:#24263A; --muted:#7A7E95;
  --ok-bg:#E6F5EC; --ok:#1C9A57;
  --warn-bg:#FBF1DC; --warn:#B5780F;
  --info-bg:#EAEEFC; --info:#3B53D9;
  --gray-bg:#EEF0F6; --gray:#6E7290;
  --danger-bg:#FBE7E7; --danger:#CE3A3A;
}
html{-webkit-text-size-adjust:100%}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
#app{display:flex;min-height:100vh}
#sidebar{width:200px;background:var(--panel);border-right:1px solid var(--border);padding:20px 12px;flex-shrink:0;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;padding:6px 10px 4px}
.logo-mark{width:36px;height:36px;flex-shrink:0}
.logo-sub{font-size:12px;color:var(--muted);padding:0 10px 18px}
.nav-btn{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:4px;border:none;background:none;border-radius:8px;font-size:14px;color:var(--text);cursor:pointer}
.nav-btn:hover{background:var(--bg)}
.nav-btn.active{background:#EAEEFC;color:var(--primary);font-weight:600}
#main{flex:1;padding:24px 28px;min-width:0}
.page{display:none;max-width:980px}
.page.active{display:block}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:19px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.card.warn-card{border-color:#F0C98A}
.card-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.card-num{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.panel-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px;font-weight:400}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;font-size:14px;border-bottom:1px solid var(--border);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--bg)}
.row-overdue td{background:var(--danger-bg)}
.empty{color:var(--muted);text-align:center;padding:18px 10px !important}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;white-space:nowrap}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-info{background:#EAEEFC;color:var(--info)}
.badge-gray{background:var(--gray-bg);color:var(--gray)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.pos{color:var(--ok);font-weight:500}
.neg{color:var(--danger);font-weight:500}
.strong{font-weight:600}
button{font-family:inherit}
.primary{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:14px;cursor:pointer}
.primary:hover{background:var(--primary-d)}
.primary.small{padding:7px 14px;font-size:13px}
.ghost{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;color:var(--text)}
.ghost:hover{border-color:var(--primary);color:var(--primary)}
.ghost.danger{color:var(--danger)}
.link-btn{background:none;border:none;color:var(--primary);cursor:pointer;font-size:13px;padding:2px 4px}
.link-btn.danger{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fdecef;color:#c0392b;padding:4px 8px;border-radius:12px;font-size:12px;margin:2px 4px 2px 0;cursor:pointer;user-select:none}
.chip:hover{background:#fbd9d6}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.cal-head{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal-day{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 0;font-size:14px;cursor:pointer;color:var(--text);transition:.15s}
.cal-day:hover:not(.empty){border-color:var(--primary);color:var(--primary)}
.cal-day.selected{background:#e74c3c;color:#fff;border-color:#e74c3c}
.cal-day.empty{background:transparent;border:none;cursor:default}
.mini-btn{background:var(--gray-bg);border:none;border-radius:6px;padding:7px 10px;font-size:12px;color:var(--text);cursor:pointer;white-space:nowrap}
input,select{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid #EAEEFC;border-color:var(--primary)}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.form-grid .span2{grid-column:span 2}
.inline-flex{display:flex;gap:8px}
.inline-flex select{flex:1}
.seg{display:inline-flex;background:var(--gray-bg);border-radius:10px;padding:4px;margin-bottom:16px}
.seg-btn{border:none;background:none;padding:8px 22px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--muted)}
.seg-btn.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.filters{display:flex;gap:8px}
.backup-btns{display:flex;gap:8px}
.backup-btns .primary{flex:1}
.filters select, .filters input[type=month], .filters input[type=text]{
  padding:7px 10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
  color:var(--fg);
  font-size:14px;
}
.hidden{display:none !important}
.check{flex-direction:row !important;align-items:center;gap:8px}
#modal-mask{position:fixed;inset:0;background:rgba(20,22,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
#modal{background:#fff;border-radius:14px;padding:20px 22px;width:100%;max-width:560px}
@media(max-width:820px){
  #modal-mask{align-items:flex-end;padding:0}
  #modal{max-width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:sheetUp .22s ease}
}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h2{font-size:16px}
.modal-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:14px}
.kv span{color:var(--muted)}
.sub-title{font-size:13px;font-weight:600;margin:16px 0 8px}
.mini-table th,.mini-table td{padding:7px 8px;font-size:13px}

/* App 风格卡片列表 */
.item-list{display:flex;flex-direction:column;gap:10px}
.item-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s}
.item-card:hover,.item-card:active{background:var(--gray-bg)}
.ic-main{flex:1;min-width:0}
.ic-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ic-sub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ic-right{text-align:right;flex-shrink:0}
.ic-amt{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.ic-sub2{font-size:12px;color:var(--muted);margin-top:2px}
.ic-act{display:flex;gap:10px;flex-shrink:0}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.inline-form input{flex:1;min-width:110px}
.modal-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:flex-end}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#24263A;color:#fff;padding:10px 22px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;z-index:99;pointer-events:none}
#toast.show{opacity:.95}

.card.add-card{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--border);cursor:pointer;min-height:76px;color:var(--muted);transition:.15s;user-select:none}
.card.add-card:hover{border-color:var(--primary);color:var(--primary)}
.card.add-card .add-plus{font-size:26px;line-height:1;color:inherit;font-weight:500}

/* 月账本样式 */
.ledger-topbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.ledger-topbar .lb-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ledger-topbar .lb-title{font-size:19px;font-weight:600}
.ledger-topbar .lb-month{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ledger-topbar .lb-month input[type=month]{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;color:var(--text);-webkit-appearance:none}
.ledger-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ledger-stats .lb-stat{background:var(--gray-bg);border-radius:10px;padding:10px 12px;text-align:center}
.ledger-stats .lb-stat-label{font-size:12px;color:var(--muted);margin-bottom:2px}
.ledger-stats .lb-stat-num{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.ledger-stats .lb-stat-num.pos{color:var(--ok)}
.ledger-stats .lb-stat-num.neg{color:var(--warn)}
.ledger-list{padding-bottom:90px}
.ledger-day-group{margin-top:16px}
.ledger-day-head{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:13px;color:var(--muted);font-weight:500}
.ledger-day-head .dot{width:6px;height:6px;border-radius:50%;background:var(--border)}
.ledger-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.ledger-item:hover{background:var(--gray-bg)}
.ledger-item .li-main{flex:1;min-width:0}
.ledger-item .li-cat{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledger-item .li-note{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledger-item .li-amt{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}
.ledger-item.expense .li-amt{color:#D84848}
.ledger-item.income .li-amt{color:#2E8B57}
.ledger-item .li-date{font-size:11px;color:var(--muted);flex-shrink:0}
.ledger-list-empty{padding:60px 20px;text-align:center;color:var(--muted)}

/* 浮动加号按钮 */
#fab-add{position:fixed;right:22px;bottom:90px;width:56px;height:56px;border-radius:50%;background:#3B53D9;color:#fff;border:none;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(59,83,217,.35);z-index:40;transition:transform .15s}
#fab-add:hover{transform:scale(1.06)}
#fab-add:active{transform:scale(.96)}
@media(max-width:820px){
  #fab-add{right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;font-size:26px}
}

@media(max-width:820px){
  body{-webkit-tap-highlight-color:transparent}
  #app{flex-direction:column}
  #sidebar{width:100%;height:auto;position:static;padding:0;border:none;background:transparent}
  .logo{display:none}
  .logo-sub{display:none}
  #sidebar nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:40}
  .nav-btn{flex:1;width:auto;margin:0;padding:10px 2px;text-align:center;font-size:12px;border-radius:8px}
  #main{padding:14px 12px calc(78px + env(safe-area-inset-bottom))}
  .page-head{flex-direction:column;align-items:flex-start;gap:10px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .card-num{font-size:17px}
  .form-grid{grid-template-columns:1fr}
  .form-grid .span2{grid-column:span 1}
  input,select{font-size:16px;padding:10px 12px}
  .panel{padding:14px;overflow-x:auto}
  th,td{white-space:nowrap}
  .panel>.primary{width:100%;padding:13px}
  .backup-btns{flex-direction:column;gap:10px}
  .backup-btns .primary{width:100%}
  .seg{width:100%}
  .seg-btn{flex:1;padding:10px 8px}
  .filters{width:100%}
  .filters select, .filters input[type=month], .filters input[type=text]{
    flex:1;min-width:0;
    padding:7px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--fg);
    font-size:14px;
    -webkit-appearance:none;
  }
  .link-btn{padding:6px 8px}
  #modal-mask{padding:0;align-items:flex-end}
  #modal{max-width:none;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M7 10c6 0 10 1.8 14 1.8S29 10 35 10v28c-6 0-10 1.8-14 1.8S13 38 7 38V10z" fill="#2E8B57"/>
        <path d="M24 11v29" stroke="#fff" stroke-width="2" fill="none"/>
        <path d="M10 18h11M10 24h11M10 30h11M27 18h11M27 24h11M27 30h11" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>公司记账</span>
    </div>
    <div class="logo-sub">仓储账务 · 单机版</div>
    <nav>
      <button class="nav-btn active" data-page="add">记一笔</button>
      <button class="nav-btn" data-page="bills">客户</button>
      <button class="nav-btn" data-page="wages">员工</button>
      <button class="nav-btn" data-page="settings">设置</button>
    </nav>
  </aside>
  <main id="main">

    <section id="page-settings" class="page">
      <div class="page-head">
        <h1>设置</h1>
      </div>
      <div class="panel">
        <div class="panel-title">导出 Excel 报表</div>
        <p class="muted" style="margin-bottom:12px">一个文件内含 5 个工作表：收支明细、应收台账、收款记录、发票台账、工资表</p>
        <div class="form-grid">
          <label>报表月份 <input type="month" id="report-month"></label>
          <label class="check" style="justify-content:flex-end"><input type="checkbox" id="report-all"> 导出全部数据（不按月份过滤）</label>
        </div>
        <button class="primary" id="btn-export-xlsx">导出 Excel</button>
      </div>
      <div class="panel">
        <div class="panel-title">备份与恢复</div>
        <p class="muted" style="margin-bottom:12px">账本数据保存在本浏览器中。清理浏览器数据前请先导出备份；建议每周备份一次，备份文件可存U盘或发送到微信文件助手。</p>
        <div class="backup-btns">
          <button class="primary" id="btn-backup">导出备份</button>
          <button class="primary" id="btn-restore">导入备份</button>
        </div>
        <input type="file" id="restore-file" accept=".json,application/json" class="hidden">
      </div>
    </section>

    <section id="page-add" class="page active">
      <div class="ledger-topbar">
        <div class="lb-row">
          <span class="lb-title">记一笔</span>
          <label class="lb-month">统计月份 <input type="month" id="ledger-month"></label>
        </div>
        <div class="ledger-stats">
          <div class="lb-stat"><div class="lb-stat-label">当月支出</div><div class="lb-stat-num neg" id="ledger-expense">¥0.00</div></div>
          <div class="lb-stat"><div class="lb-stat-label">当月收入</div><div class="lb-stat-num pos" id="ledger-income">¥0.00</div></div>
        </div>
      </div>
      <div class="ledger-list" id="ledger-list"></div>
      <button id="fab-add" title="记一笔">+</button>
    </section>

    <!-- 记一笔弹窗：支出 / 收入 两个标签 -->
    <template id="tx-form-modal">
      <div class="modal-head"><h2>记一笔</h2><button class="modal-x" data-close>&times;</button></div>
      <div class="seg" style="margin-bottom:14px">
        <button class="seg-btn active" id="tab-expense">支出</button>
        <button class="seg-btn" id="tab-income">收入</button>
      </div>
      <p class="muted" id="tx-hint" style="margin-bottom:12px"></p>
      <div id="tx-expense-fields">
        <div class="form-grid">
          <label>主分类 <select id="tx-group">
            <option value="仓库">仓库</option>
            <option value="车队">车队</option>
            <option value="其他">其他</option>
          </select></label>
          <label id="wrap-subcategory">子分类 <select id="tx-category"></select></label>
          <label id="wrap-tx-date">日期 <input type="date" id="tx-date"></label>
          <label>金额（元） <input type="number" id="tx-amount" min="0.01" step="0.01" inputmode="decimal"></label>
          <label>付款状态 <select id="tx-status">
            <option value="paid">现结（已付款）</option>
            <option value="pending">应付（先挂账）</option>
          </select></label>
          <label class="span2">备注 <input type="text" id="tx-note" placeholder="选填，可写司机名/供应商名" autocomplete="off"></label>
        </div>
        <button class="primary" id="btn-save-tx">保存</button>
        <p class="muted" style="margin-top:8px">选「应付」先挂账，不计入支出统计；点流水里的挂账条目可登记付款，付款后计入支出</p>
      </div>
      <div id="tx-income-fields" class="hidden">
        <div class="form-grid">
          <label>客户 <select id="bill2-customer"></select></label>
          <label>费用类型 <select id="bill2-fee-type"><option>进仓费</option><option>修理费</option><option>放单费</option><option>其他</option></select></label>
          <label>账期（月份） <input type="month" id="bill2-period"></label>
          <label>金额（元） <input type="number" id="bill2-amount" min="0.01" step="0.01" inputmode="decimal"></label>
        </div>
        <button class="primary" id="btn-save-bill2">添加账单</button>
        <p class="muted" style="margin-top:8px">客户付款后在「客户」页的账单卡片里登记收款，收款会自动生成收入流水</p>
      </div>
    </template>

    <section id="page-bills" class="page">
      <div class="page-head"><h1>客户</h1></div>
      <div class="cards">
        <div class="card warn-card"><div class="card-label">待收总额（全部账单）</div><div class="card-num" style="color:var(--warn)" id="stat-unpaid">¥0.00</div></div>
        <div class="card add-card" id="card-add-bill">
          <div class="card-label">添加客户月账单</div>
          <div class="card-num add-plus">＋</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">账单列表
          <span class="filters">
            <select id="bill-filter-customer"></select>
            <select id="bill-filter-status">
              <option value="">全部状态</option>
              <option value="unpaid" selected>待收</option>
              <option value="partial">部分收款</option>
              <option value="settled">已结清</option>
            </select>
          </span>
        </div>
        <div class="item-list" id="bills-list"></div>
        <p class="muted" style="margin-top:8px">点击任意一张，可记收款、登记发票</p>
      </div>

              <option value="">全部状态</option>

            </select>

<div id="modal-mask" class="hidden"><div id="modal"></div></div>
<div id="toast" class="hidden"></div>

<script src="xlsx.min.js"></script>
<script>
'use strict';

/* ---------- 基础工具 ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayStr = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};
const monthStr = () => todayStr().slice(0, 7);
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const fmt = n => '¥' + round2(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt2 = n => round2(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtShort = n => '¥' + round2(n).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
const fmtInt = n => '¥' + Math.round(Number(n) || 0).toLocaleString('zh-CN');
const fmtWage = n => (Number(n) > 0) ? fmtInt(n) : '<span class="muted">未设定</span>';
const wagePaid = w => (w.payments || []).reduce((s, p) => s + Number(p.amount || 0), 0);
function wageStatus(w) {
  const total = Number(w.amount) || 0;
  const paid = wagePaid(w);
  if (total <= 0) return paid > 0 ? 'partial' : 'pending';
  if (paid <= 0) return 'pending';
  if (paid >= total) return 'paid';
  return 'partial';
}
const absCount = w => (w.absenceDates && w.absenceDates.length) || (w.absence || 0);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const daysBetween = (from, to) => Math.floor((new Date(to) - new Date(from)) / 86400000);
const stBadge = k => k === 'settled' ? 'ok' : k === 'partial' ? 'info' : 'warn';

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => { t.classList.remove('show'); t.classList.add('hidden'); }, 2200);
}

/* ---------- 数据层（IndexedDB） ---------- */
// 全局错误兜底：任何静默失败都以提示浮出，便于定位
window.addEventListener('error', e => { try { toast('出错了：' + (e.message || '未知错误')); } catch (_) {} });
window.addEventListener('unhandledrejection', e => { try { const r = e.reason; toast('操作失败：' + ((r && r.message) || r || '未知错误')); } catch (_) {} });
const STORES = ['customers', 'incomes', 'expenses', 'bills', 'payments', 'invoices', 'employees', 'wages', 'meta'];
let _db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('company-ledger', 7);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); });
      // 已删除功能的存储清理
      if (db.objectStoreNames.contains('assets')) db.deleteObjectStore('assets');
      if (db.objectStoreNames.contains('purchases')) db.deleteObjectStore('purchases');
      if (db.objectStoreNames.contains('reimbursements')) db.deleteObjectStore('reimbursements');
    };
    req.onsuccess = e => {
      _db = e.target.result;
      _db.onversionchange = () => { _db.close(); };
      resolve(_db);
    };
    req.onerror = () => reject(req.error);
    req.onblocked = () => {
      alert('本软件在另一个标签页/窗口中还开着旧版本，数据库无法升级。\n\n请把其他打开本软件的页面全部关闭，本页会自动恢复正常（无需手动刷新）。');
    };
  });
}
const dbGetAll = store => new Promise((resolve, reject) => {
  const r = _db.transaction(store).objectStore(store).getAll();
  r.onsuccess = () => resolve(r.result || []);
  r.onerror = () => reject(r.error);
});
const dbPut = (store, val) => new Promise((resolve, reject) => {
  const tx = _db.transaction(store, 'readwrite');
  tx.objectStore(store).put(val);
  tx.oncomplete = resolve;
  tx.onerror = () => reject(tx.error);
});
const dbDel = (store, key) => new Promise((resolve, reject) => {
  const tx = _db.transaction(store, 'readwrite');
  tx.objectStore(store).delete(key);
  tx.oncomplete = resolve;
  tx.onerror = () => reject(tx.error);
});
const dbClear = store => new Promise((resolve, reject) => {
  const tx = _db.transaction(store, 'readwrite');
  tx.objectStore(store).clear();
  tx.oncomplete = resolve;
  tx.onerror = () => reject(tx.error);
});

const DEFAULTS = {
  overdueDays: 30,
  seeded: false,
  catGroups: {
    '仓库': ['办公用品', '工具材料', '油费'],
    '车队': ['上车费', '高速费', '油费', '打印费'],
    '员工': ['员工工资', '报销']
  }
};
const LEGACY_CATS = { '工资': ['员工', '员工工资'], '办公用品': ['仓库', '办公用品'], '仓库工具': ['仓库', '工具材料'], '车队报销': ['车队', '其他'] };
const ROLE_ORDER = ['叉车工', '装卸工', '司机', '调度', '操作', '换单'];
let S = { customers: [], incomes: [], expenses: [], bills: [], payments: [], invoices: [], employees: [], wages: [], settings: Object.assign({}, DEFAULTS) };

async function loadState() {
  const [customers, incomes, expenses, bills, payments, invoices, employees, wages, meta] = await Promise.all(STORES.map(dbGetAll));
  S.customers = customers.sort((a, b) => a.createdAt - b.createdAt);
  S.incomes = incomes; S.expenses = expenses; S.bills = bills; S.payments = payments; S.invoices = invoices;
  S.employees = employees.sort((a, b) => a.createdAt - b.createdAt); S.wages = wages;
  // 迁移：旧工资单若有 paidDate 但无 payments → 用已生成的支出记录反推一条 payment
  let needSave = false;
  for (const w of S.wages) {
    if (w.paidDate && (!w.payments || w.payments.length === 0)) {
      const ex = S.expenses.find(x => x.wageId === w.id);
      w.payments = [{ id: uid(), amount: ex ? Number(ex.amount) : Number(w.amount) || 0, date: w.paidDate, note: '' }];
      needSave = true;
    } else if (!w.payments) {
      w.payments = [];
    }
  }
  if (needSave) {
    for (const w of S.wages) {
      if (w.payments && w.payments.length === 1 && !w.payments[0].__migrated) {
        await dbPut('wages', w);
        w.payments[0].__migrated = true;
      }
    }
  }
  const m = {};
  meta.forEach(r => { m[r.id] = r.value; });
  S.settings = Object.assign({}, DEFAULTS, m);
  S.settings.catGroups = Object.assign({}, DEFAULTS.catGroups, S.settings.catGroups || {});
}
const saveSetting = (key, value) => dbPut('meta', { id: key, value: value });

async function migrateCategories() {
  // 车队子分类统一为：上车费/高速费/油费/打印费（员工报销并入支出·车队）
  const FLEET_SUBS = ['上车费', '高速费', '油费', '打印费'];
  if (JSON.stringify(S.settings.catGroups['车队']) !== JSON.stringify(FLEET_SUBS)) {
    S.settings.catGroups['车队'] = FLEET_SUBS;
    await saveSetting('catGroups', S.settings.catGroups);
  }
  // 老数据补上「报销」子分类（历史报销生成的支出仍能显示分类名）
  if (!(S.settings.catGroups['员工'] || []).includes('报销')) {
    S.settings.catGroups['员工'] = (S.settings.catGroups['员工'] || []).concat(['报销']);
    await saveSetting('catGroups', S.settings.catGroups);
  }
  if (S.settings.catMigrated) return;
  let changed = false;
  for (const e2 of S.expenses) {
    const map = LEGACY_CATS[e2.category];
    if (map && !e2.sub) {
      e2.category = map[0];
      e2.sub = map[1];
      await dbPut('expenses', e2);
      changed = true;
    }
  }
  await saveSetting('catMigrated', true);
  if (changed) await loadState();
}

/* ---------- 派生状态 ---------- */
const custName = id => { const c = S.customers.find(c => c.id === id); return c ? c.name : '(已删除客户)'; };
const empName = id => { const e2 = S.employees.find(x => x.id === id); return e2 ? e2.name : '(已删除员工)'; };
const paidOf = billId => round2(S.payments.filter(p => p.billId === billId).reduce((s, p) => s + Number(p.amount), 0));
function billState(b) {
  const paid = paidOf(b.id);
  let remaining = round2(Number(b.amount) - paid);
  let key = 'unpaid', label = '待收';
  if (remaining <= 0) { key = 'settled'; label = '已结清'; remaining = 0; }
  else if (paid > 0)  { key = 'partial'; label = '部分收款'; }
  return { paid, remaining, key, label };
}
function invState(b) {
  const invoiced = round2(S.invoices.filter(i => i.billId === b.id).reduce((s, i) => s + (Number(i.amount) > 0 ? Number(i.amount) : Number(b.amount)), 0));
  const remaining = Math.max(0, round2(Number(b.amount) - invoiced));
  let key = 'none', label = '待开票';
  if (invoiced > 0 && remaining <= 0) { key = 'done'; label = '已开票'; }
  else if (invoiced > 0) { key = 'partial'; label = '部分开票'; }
  return { invoiced, remaining, key, label };
}
const invBadge = k => k === 'done' ? 'ok' : k === 'partial' ? 'info' : 'gray';
/* ---------- 员工报销已并入记一笔支出（待报销挂账模式） ---------- */

/* ---------- 页面切换 ---------- */
let currentPage = 'add';
$$('.nav-btn').forEach(b => b.addEventListener('click', () => switchPage(b.dataset.page)));
function switchPage(p) {
  currentPage = p;
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === p));
  $$('.page').forEach(pg => pg.classList.toggle('active', pg.id === 'page-' + p));
  renderPage(p);
}
function renderPage(p) {
  ({ add: renderAdd, bills: () => { renderUnpaid(); renderBills(); renderCustomers(); }, wages: renderWages, settings: () => {} }[p] || function () {})();
}

/* ---------- 待收总额（账单页顶部） ---------- */
function renderUnpaid() {
  const unsettled = S.bills.map(b => ({ b, st: billState(b) })).filter(x => x.st.key !== 'settled');
  $('#stat-unpaid').textContent = fmt(round2(unsettled.reduce((s, x) => s + x.st.remaining, 0)));
}

/* ---------- 记一笔 ---------- */
const catLabel = r => r.sub ? r.category + ' · ' + r.sub : (r.category || '');

function renderAdd() {
  // page-add 显示月账本，表单按需弹出
  const lm = $('#ledger-month');
  if (lm && !lm.value) lm.value = todayStr().slice(0, 7);
  renderLedger();
}

let ledgerMonthCache = null;
function renderLedger() {
  const period = $('#ledger-month').value || todayStr().slice(0, 7);
  ledgerMonthCache = period;
  const [y, m] = period.split('-').map(Number);
  // 当月收支（挂账支出不计入统计）
  let income = 0, expense = 0, reimbSum = 0, payableSum = 0;
  S.incomes.forEach(i => { if ((i.date || '').startsWith(period)) income += Number(i.amount || 0); });
  S.expenses.forEach(e => {
    if (!(e.date || '').startsWith(period)) return;
    if (e.status === 'pending') {
      if (e.pendingKind === 'payable') payableSum += Number(e.amount || 0);
      else reimbSum += Number(e.amount || 0);
    } else expense += Number(e.amount || 0);
  });
  const pendNote = [reimbSum > 0 ? '待报销 ' + fmt2(reimbSum) : '', payableSum > 0 ? '应付 ' + fmt2(payableSum) : ''].filter(Boolean).join('、');
  $('#ledger-income').textContent = '+' + fmt2(income);
  $('#ledger-expense').textContent = '−' + fmt2(expense) + (pendNote ? '（另有' + pendNote + '）' : '');
  if (!$('#ledger-month').value) $('#ledger-month').value = period;
  // 月流水列表（按日期分组）
  const all = S.incomes.map(i => ({ id: i.id, store: 'incomes', date: i.date, type: 'income', cat: i.type || '其他收入', who: custName(i.customerId), amount: Number(i.amount), note: i.note }))
    .concat(S.expenses.map(e => ({ id: e.id, store: 'expenses', date: e.date, type: 'expense', cat: catLabel(e), who: '', amount: Number(e.amount), note: e.note, pending: e.status === 'pending', kind: e.pendingKind === 'payable' ? 'payable' : 'reimb' })))
    .filter(r => (r.date || '').startsWith(period))
    .sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  if (!all.length) {
    const hasAny = S.incomes.length + S.expenses.length > 0;
    $('#ledger-list').innerHTML = '<div class="ledger-list-empty">本月暂无收支<br><span style="font-size:12px">'
      + (hasAny ? '用上方 ‹ › 切换月份查看其他月份记录' : '点右下角 + 添加第一条')
      + '</span></div>';
    return;
  }
  const weekday = d => {
    const arr = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    return arr[new Date(d).getDay()];
  };
  let html = '';
  let lastDate = '';
  all.forEach(r => {
    if (r.date !== lastDate) {
      html += '<div class="ledger-day-group"><div class="ledger-day-head"><span class="dot"></span><span>' + r.date + '</span><span class="muted" style="margin-left:4px">' + weekday(r.date) + '</span><span style="flex:1"></span>';
      const dayInc = all.filter(x => x.date === r.date && x.type === 'income').reduce((s, x) => s + x.amount, 0);
      const dayExp = all.filter(x => x.date === r.date && x.type === 'expense').reduce((s, x) => s + x.amount, 0);
      if (dayInc) html += '<span class="pos" style="font-size:12px;margin-left:8px">收 +' + fmt2(dayInc) + '</span>';
      if (dayExp) html += '<span style="font-size:12px;margin-left:6px;color:#D84848">支 −' + fmt2(dayExp) + '</span>';
      html += '</div>';
      lastDate = r.date;
    }
    const amtSign = r.type === 'income' ? '+' : '−';
    const amtStyle = r.pending ? ' style="color:var(--warn)"' : '';
    const pendBadge = r.pending ? ' <span class="badge badge-warn">' + (r.kind === 'payable' ? '应付' : '待报销') + '</span>' : '';
    html += '<div class="ledger-item ' + r.type + '" data-ledger="' + r.store + ':' + r.id + '">'
      + '<div class="li-main">'
      + '<div class="li-cat">' + esc(r.cat) + (r.who ? ' · ' + esc(r.who) : '') + pendBadge + '</div>'
      + '<div class="li-note">' + esc(r.note || '') + '</div>'
      + '</div>'
      + '<div class="li-amt"' + amtStyle + '>' + amtSign + fmt2(r.amount) + '</div>'
      + '<div class="li-date"></div>'
      + '</div>';
  });
  $('#ledger-list').innerHTML = html;
}

function renderTxSubs() {
  const g = $('#tx-group').value;
  const wrap = $('#wrap-subcategory');
  const subs = S.settings.catGroups[g] || [];
  if (g !== '其他' && subs.length) {
    wrap.classList.remove('hidden');
    $('#tx-category').innerHTML = subs.map(s => '<option>' + esc(s) + '</option>').join('');
  } else {
    wrap.classList.add('hidden');
  }
}

function initTxForm() {
  $('#tx-date').value = todayStr();
  $('#tx-amount').value = '';
  $('#tx-note').value = '';
  $('#tx-status').value = 'paid';
  $('#wrap-tx-date').classList.remove('hidden');
  if (!$('#tx-group').value) $('#tx-group').value = '仓库';
  renderTxSubs();
  // 收入（添加账单）表单
  const prevC = $('#bill2-customer').value;
  $('#bill2-customer').innerHTML = S.customers.map(c => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('');
  const lastC = prevC || S.settings.lastBillCustomer;
  if (lastC && S.customers.some(c => c.id === lastC)) $('#bill2-customer').value = lastC;
  $('#bill2-period').value = monthStr();
  $('#bill2-amount').value = '';
  setTxTab('expense');
  // 滚动到 modal 顶部
  const mask = $('#modal-mask');
  if (mask) mask.scrollTop = 0;
}

let txTab = 'expense';
function setTxTab(t) {
  txTab = t;
  $('#tab-expense').classList.toggle('active', t === 'expense');
  $('#tab-income').classList.toggle('active', t === 'income');
  $('#tx-expense-fields').classList.toggle('hidden', t !== 'expense');
  $('#tx-income-fields').classList.toggle('hidden', t !== 'income');
  $('#tx-hint').textContent = t === 'expense'
    ? '工资在发放时自动记录；员工垫付费用选「车队」分类，可勾选待报销先挂账。'
    : '客户应收账单：客户付款后在「客户」页账单卡片里登记收款。';
}

function openTxForm() {
  const tpl = $('#tx-form-modal');
  $('#modal').innerHTML = tpl.innerHTML;
  $('#modal-mask').classList.remove('hidden');
  initTxForm();
  bindTxFormEvents();
  setTimeout(() => { const el = $('#tx-amount'); if (el) el.focus(); }, 30);
}

// 弹窗内容是动态注入的，事件必须在注入后再绑定
function bindTxFormEvents() {
  $('#tab-expense').addEventListener('click', () => setTxTab('expense'));
  $('#tab-income').addEventListener('click', () => setTxTab('income'));
  $('#tx-group').addEventListener('change', renderTxSubs);
  $('#tx-status').addEventListener('change', () => {
    $('#wrap-tx-date').classList.toggle('hidden', $('#tx-status').value === 'pending');
  });
  $('#btn-save-tx').addEventListener('click', saveTx);
  $('#btn-save-bill2').addEventListener('click', saveBill2);
  ['#tx-amount', '#tx-note'].forEach(sel => {
    $(sel).addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); saveTx(); }
    });
  });
  $('#bill2-amount').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveBill2(); } });
}

async function saveBill2() {
  const cid = $('#bill2-customer').value;
  const period = $('#bill2-period').value;
  const amount = round2($('#bill2-amount').value);
  if (!cid) { toast('请先在「客户」页添加客户'); return; }
  if (!period) { toast('请选择账期'); return; }
  if (!amount || amount <= 0) { toast('请输入正确金额'); return; }
  const dup = S.bills.some(b => b.customerId === cid && b.period === period);
  if (dup && !confirm('该客户这个账期已有账单，确定再添加一张吗？')) return;
  await dbPut('bills', { id: uid(), customerId: cid, feeType: $('#bill2-fee-type').value, period: period, amount: amount, billDate: '', createdAt: Date.now() });
  await saveSetting('lastBillCustomer', cid);
  await loadState();
  closeModal();
  renderBills();
  renderCustomers();
  renderLedger();
  toast('账单已添加，收款请在「客户」页登记');
}

async function saveTx() {
  const amount = round2($('#tx-amount').value);
  const note = $('#tx-note').value.trim();
  const isPending = $('#tx-status').value === 'pending';
  const date = isPending ? todayStr() : $('#tx-date').value;
  if (!isPending && !date) { toast('请选择日期'); return; }
  if (!amount || amount <= 0) { toast('请输入正确金额'); return; }
  if (S.expenses.some(r => r.date === date && round2(Number(r.amount)) === amount)) {
    if (!confirm(date + ' 已有一笔相同金额的支出，是否重复录入？')) return;
  }
  const group = $('#tx-group').value;
  const sub = (group === '仓库' || group === '车队') ? ($('#tx-category').value || '') : '';
  await dbPut('expenses', { id: uid(), date: date, category: group, sub: sub, amount: amount, note: note, status: isPending ? 'pending' : null, pendingKind: isPending ? (group === '仓库' ? 'payable' : 'reimb') : null, createdAt: Date.now() });
  await loadState();
  closeModal();
  if (currentPage === 'add') renderLedger();
  toast(isPending ? '已挂账（应付）' : '已保存');
}

// 月份切换
$('#ledger-month').addEventListener('change', renderLedger);
function shiftMonth(delta) {
  const [y, m] = ($('#ledger-month').value || todayStr().slice(0, 7)).split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  $('#ledger-month').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  renderLedger();
}
// 滚到底部再往下 → 上个月；滚到顶部再往上 → 下个月
(function ledgerSwipe() {
  const THRESHOLD = 70;
  let startY = 0, startX = 0, tracking = false, lastJump = 0;
  const scroller = () => document.scrollingElement || document.documentElement;
  const atBottom = () => {
    const s = scroller();
    return s.scrollTop + window.innerHeight >= s.scrollHeight - 4;
  };
  const atTop = () => scroller().scrollTop <= 2;
  const canJump = () => Date.now() - lastJump > 700;

  window.addEventListener('touchstart', e => {
    if (!document.getElementById('page-add').classList.contains('active')) return;
    if (e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    tracking = true;
  }, { passive: true });

  window.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    if (!document.getElementById('page-add').classList.contains('active')) return;
    const t = e.changedTouches[0];
    const dy = t.clientY - startY;
    const dx = t.clientX - startX;
    if (Math.abs(dx) > Math.abs(dy)) return;      // 横向滑动忽略
    if (Math.abs(dy) < THRESHOLD) return;
    if (!canJump()) return;
    if (atBottom() && dy < 0) {                   // 到底后继续往下滑 → 上个月
      lastJump = Date.now();
      shiftMonth(-1);
      window.scrollTo(0, 0);
    } else if (atTop() && dy > 0) {               // 到顶后继续往上拉 → 下个月
      lastJump = Date.now();
      shiftMonth(1);
      window.scrollTo(0, 0);
    }
  }, { passive: true });

  // 电脑端：鼠标滚轮在边界继续滚动同样切月
  window.addEventListener('wheel', e => {
    if (!document.getElementById('page-add').classList.contains('active')) return;
    if (!canJump()) return;
    if (atBottom() && e.deltaY > 0) {
      lastJump = Date.now();
      shiftMonth(-1);
      window.scrollTo(0, 0);
    } else if (atTop() && e.deltaY < 0) {
      lastJump = Date.now();
      shiftMonth(1);
      window.scrollTo(0, 0);
    }
  }, { passive: true });
})();

function closeModal() { $('#modal-mask').classList.add('hidden'); currentBillId = null; currentWageId = null; }
$('#modal-mask').addEventListener('click', e => { if (e.target.id === 'modal-mask') closeModal(); });

$('#modal').addEventListener('click', async e => {
  const t = e.target;
  if (t.closest('[data-close]')) { closeModal(); return; }

  if (t.id === 'btn-add-cust') {
    const name = $('#cust-name').value.trim();
    if (!name) { toast('请输入客户名称'); return; }
    if (S.customers.some(c => c.name === name)) { toast('客户已存在'); return; }
    await dbPut('customers', { id: uid(), name: name, createdAt: Date.now() });
    await loadState();
    renderCustomers();
    renderBills();
    toast('客户已添加');
    $('#btn-cust-manage').click(); // 刷新弹窗
    return;
  }
  if (t.closest('[data-rencust-modal]')) {
    const cid = t.closest('[data-rencust-modal]').dataset.rencustModal;
    const c = S.customers.find(x => x.id === cid);
    if (!c) return;
    $('#modal').innerHTML =
      '<div class="modal-head"><h2>重命名客户</h2><button class="modal-x" data-close>&times;</button></div>'
      + '<div class="form-grid"><label class="span2">客户名称 <input type="text" id="cust-rename" autocomplete="off" value="' + esc(c.name) + '"></label></div>'
      + '<button class="primary" id="btn-cust-rename-save" data-cust-id="' + cid + '">保存</button>';
    setTimeout(() => { const el = $('#cust-rename'); if (el) { el.focus(); el.select(); } }, 30);
    return;
  }
  if (t.id === 'btn-cust-rename-save') {
    const cid = t.dataset.custId;
    const c = S.customers.find(x => x.id === cid);
    if (!c) return;
    const name = $('#cust-rename').value.trim();
    if (!name) { toast('请输入客户名称'); return; }
    if (S.customers.some(x => x.name === name && x.id !== cid)) { toast('客户已存在'); return; }
    await dbPut('customers', Object.assign({}, c, { name: name }));
    await loadState();
    renderCustomers();
    renderBills();
    toast('已重命名');
    $('#btn-cust-manage').click(); // 刷新弹窗
    return;
  }
  if (t.closest('[data-delcust-modal]')) {
    const del = t.closest('[data-delcust-modal]');
    const cid = del.dataset.delcustModal;
    const c = S.customers.find(x => x.id === cid);
    if (!c) return;
    const used = S.incomes.some(i => i.customerId === cid) || S.bills.some(b => b.customerId === cid);
    if (used) { toast('该客户已有收入/账单记录，不能删除'); return; }
    if (!confirm('确定删除客户「' + c.name + '」？')) return;
    await dbDel('customers', cid);
    await loadState();
    renderBills();
    renderCustomers();
    $('#btn-cust-manage').click(); // 刷新弹窗
    return;
  }

  if (t.id === 'btn-add-pay') {
    const date = $('#pay-date').value || todayStr();
    const amount = round2($('#pay-amount').value);
    const note = $('#pay-note').value.trim();
    if (!amount || amount <= 0) { toast('请输入正确金额'); return; }
    const bill = S.bills.find(x => x.id === currentBillId);
    if (!bill) return;
    const pid = uid();
    await dbPut('payments', { id: pid, billId: currentBillId, date: date, amount: amount, note: note, createdAt: Date.now() });
    // 收款自动生成收入流水（记一笔可见，删除收款时联动删除）
    await dbPut('incomes', { id: uid(), date: date, type: bill.feeType || '账单收款', customerId: bill.customerId, amount: amount, note: note, billId: bill.id, paymentId: pid, createdAt: Date.now() });
    await loadState();
    openBillModal(currentBillId);
    renderBills();
    renderCustomers();
    toast('收款已登记，收入已计入记一笔');
    return;
  }
  if (t.dataset.delpay) {
    if (!confirm('删除这笔收款？「记一笔」中对应的收入将一并删除。')) return;
    for (const inc of S.incomes.filter(i => i.paymentId === t.dataset.delpay)) await dbDel('incomes', inc.id);
    await dbDel('payments', t.dataset.delpay);
    await loadState();
    openBillModal(currentBillId);
    renderBills();
    renderCustomers();
    return;
  }
  if (t.id === 'btn-add-inv') {
    const amount = round2($('#inv-amount').value);
    const date = $('#inv-date').value;
    if (!amount || amount <= 0) { toast('请输入正确金额'); return; }
    await dbPut('invoices', { id: uid(), billId: currentBillId, invoiceNo: '', amount: amount, date: date, createdAt: Date.now() });
    await loadState();
    openBillModal(currentBillId);
    renderBills();
    renderCustomers();
    toast('开票已登记');
    return;
  }
  if (t.dataset.delinv) {
    if (!confirm('删除这条发票记录？')) return;
    await dbDel('invoices', t.dataset.delinv);
    await loadState();
    openBillModal(currentBillId);
    renderBills();
    renderCustomers();
    return;
  }
  if (t.id === 'btn-del-bill') {
    if (!confirm('删除账单将同时删除它的收款、发票记录及记一笔中生成的收入，确定吗？')) return;
    const bid = currentBillId;
    for (const inc of S.incomes.filter(i => i.billId === bid)) await dbDel('incomes', inc.id);
    for (const p of S.payments.filter(p => p.billId === bid)) await dbDel('payments', p.id);
    for (const iv of S.invoices.filter(i => i.billId === bid)) await dbDel('invoices', iv.id);
    await dbDel('bills', bid);
    await loadState();
    closeModal();
    renderBills();
    renderCustomers();
    toast('账单已删除');
  }

  if (t.id === 'btn-wage-amount-save') {
    const w = S.wages.find(x => x.id === currentWageId);
    if (!w) return;
    const val = Math.max(0, Math.round(Number($('#wage-amount-edit').value) || 0));
    w.amount = val;
    await dbPut('wages', w);
    await loadState();
    openWageModal(currentWageId);
    renderWages();
    toast(val > 0 ? '工资金额已更新' : '工资金额已清空');
    return;
  }
  if (t.id === 'btn-wage-pay-add') {
    const w = S.wages.find(x => x.id === currentWageId);
    if (!w) return;
    const total = Number(w.amount) || 0;
    if (total <= 0) { toast('请先填写工资金额'); return; }
    const paidBefore = wagePaid(w);
    const remain = Math.max(0, total - paidBefore);
    let amt = Math.round(Number($('#wage-pay-amount').value) || 0);
    if (!amt || amt <= 0) amt = remain; // 留空=全部剩余
    const date = $('#wage-pay-date').value;
    const note = $('#wage-pay-note').value.trim();
    if (!date) { toast('请选择发放日期'); return; }
    if (amt > remain) { if (!confirm('本次发放金额（' + fmtInt(amt) + '）超过剩余待发（' + fmtInt(remain) + '），确定吗？')) return; }
    w.payments = w.payments || [];
    const pid = uid();
    w.payments.push({ id: pid, amount: amt, date: date, note: note });
    w.paidDate = date; // latest payment date, kept for backward-compat display
    await dbPut('wages', w);
    await dbPut('expenses', { id: uid(), date: date, category: '员工', sub: '员工工资', amount: amt, note: empName(w.employeeId) + ' ' + w.period + ' 工资发放' + (note ? '（' + note + '）' : ''), wageId: w.id, paymentId: pid, createdAt: Date.now() });
    await loadState();
    openWageModal(currentWageId);
    renderWages();
    const stAfter = wageStatus(w);
    toast(stAfter === 'paid' ? '已全额发放' : '登记发放成功（累计 ' + fmtInt(wagePaid(w)) + '）');
    return;
  }
  if (t.dataset.delWagePay) {
    const w = S.wages.find(x => x.id === currentWageId);
    if (!w) return;
    const pid = t.dataset.delWagePay;
    const pay = (w.payments || []).find(p => p.id === pid);
    if (!pay) return;
    if (!confirm('删除这条发放记录？对应的工资支出也将一并删除。')) return;
    // 删对应支出
    const exToDel = S.expenses.filter(x => x.wageId === w.id && (x.paymentId === pid || (x.amount == pay.amount && !x.paymentId)));
    for (const ex of exToDel) await dbDel('expenses', ex.id);
    w.payments = (w.payments || []).filter(p => p.id !== pid);
    // 自动维护 paidDate（最后一条发放日期，无则清空）
    if (w.payments.length) {
      w.payments.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      w.paidDate = w.payments[0].date;
    } else {
      w.paidDate = null;
    }
    await dbPut('wages', w);
    await loadState();
    openWageModal(currentWageId);
    renderWages();
    return;
  }
  if (t.id === 'btn-wage-del') {
    const w = S.wages.find(x => x.id === currentWageId);
    if (!w) return;
    const hasPay = (w.payments || []).length > 0;
    if (!confirm('删除这张工资单？' + (hasPay ? '所有发放记录及对应的工资支出将一并删除。' : ''))) return;
    for (const ex of S.expenses.filter(x => x.wageId === w.id)) await dbDel('expenses', ex.id);
    await dbDel('wages', w.id);
    await loadState();
    closeModal();
    renderWages();
    toast('工资单已删除');
  }

  if (t.id === 'btn-ledger-pay') {
    if (!currentLedgerId) return;
    const rec = S.expenses.find(x => x.id === currentLedgerId.id);
    if (!rec) return;
    const date = $('#ledger-pay-date').value;
    if (!date) { toast('请选择报销日期'); return; }
    rec.date = date;
    rec.status = null;
    rec.pendingKind = null;
    await dbPut('expenses', rec);
    await loadState();
    closeModal();
    currentLedgerId = null;
    renderLedger();
    toast(kind === 'payable' ? '付款已登记，计入 ' + date + ' 支出' : '已确认报销，计入 ' + date + ' 支出');
    return;
  }
  if (t.id === 'btn-ledger-del') {
    if (!currentLedgerId) return;
    if (!confirm('删除这条记录？')) return;
    await dbDel(currentLedgerId.store, currentLedgerId.id);
    await loadState();
    closeModal();
    currentLedgerId = null;
    renderLedger();
    toast('已删除');
    return;
  }

  if (t.classList.contains('cal-day') && t.dataset.absDay) {
    const w = S.wages.find(x => x.id === currentWageId);
    if (!w) return;
    const day = Number(t.dataset.absDay);
    const d = w.period + '-' + String(day).padStart(2, '0');
    const dates = (w.absenceDates || []).slice();
    const idx = dates.indexOf(d);
    if (idx >= 0) dates.splice(idx, 1); else dates.push(d);
    w.absenceDates = dates;
    w.absence = dates.length;
    await dbPut('wages', w);
    await loadState();
    openWageModal(currentWageId);
    renderWages();
    return;
  }
});

function openCustModal(cid) {
  const c = S.customers.find(x => x.id === cid);

  const incs = S.incomes.filter(i => i.customerId === cid).sort((a, b) => b.date.localeCompare(a.date));

function renderWages() {
  const sortedEmps = S.employees.slice().sort((a, b) => {
    const ai = ROLE_ORDER.indexOf(a.role);
    const bi = ROLE_ORDER.indexOf(b.role);
    const ar = ai < 0 ? ROLE_ORDER.length : ai;
    const br = bi < 0 ? ROLE_ORDER.length : bi;
    if (ar !== br) return ar - br;
    return (a.name || '').localeCompare(b.name || '', 'zh-CN');
  });
  $('#emp-list').innerHTML = sortedEmps.map(e2 =>
    '<div class="item-card">'
    + '<div class="ic-main">'
    + '<div class="ic-title">' + esc(e2.name) + ' ' + (e2.role ? '<span class="badge badge-info">' + esc(e2.role) + '</span>' : '') + '</div>'
    + '</div>'
    + '<div class="ic-act">'
    + (e2.active ? '<span class="badge badge-ok">在职</span>' : '<span class="badge badge-gray">离职</span>')
    + '<button class="link-btn" data-toggle-emp="' + e2.id + '">' + (e2.active ? '离职' : '恢复') + '</button>'
    + '<button class="link-btn danger" data-del-emp="' + e2.id + '">删除</button>'
    + '</div></div>'
  ).join('') || '<div class="empty" style="padding:18px;text-align:center;color:var(--muted)">暂无员工</div>';
  const empCount = S.employees.length;
  const label = $('#emp-count-label');
  if (label) label.textContent = '（共 ' + empCount + ' 人）';
  renderWageGen();
  renderWageList();
}

function renderWageGen() {
  const periodInput = $('#wage-period');
  if (!periodInput.value) periodInput.value = monthStr();
  const period = periodInput.value;
  const actives = S.employees.filter(e2 => e2.active);
  const pending = actives.filter(e2 => !S.wages.some(w => w.employeeId === e2.id && w.period === period));
  const sel = $('#wage-emp-select');
  sel.innerHTML = pending.length
    ? pending.map(e2 => '<option value="' + e2.id + '">' + esc(e2.name) + '</option>').join('')
    : '<option value="">' + (actives.length ? '本月工资已全部生成' : '暂无在职员工') + '</option>';
  sel.disabled = !pending.length;
  $('#wage-amount').disabled = !pending.length;
}

function renderWageList() {
  const m = $('#wage-filter-month').value;
  const st = $('#wage-filter-status').value;
  const n = ($('#wage-filter-name').value || '').trim();
  const stLabel = s => s === 'paid' ? '<span class="badge badge-ok">已发</span>' : s === 'partial' ? '<span class="badge badge-info">部分发放</span>' : '<span class="badge badge-gray">待发</span>';
  let list = S.wages.slice().sort((a, b) => b.period.localeCompare(a.period) || empName(a.employeeId).localeCompare(empName(b.employeeId), 'zh'));
  if (m) list = list.filter(w => w.period === m);
  if (st === 'pending') list = list.filter(w => wageStatus(w) === 'pending');
  if (st === 'partial') list = list.filter(w => wageStatus(w) === 'partial');
  if (st === 'paid') list = list.filter(w => wageStatus(w) === 'paid');
  if (n) list = list.filter(w => empName(w.employeeId).indexOf(n) >= 0);
  $('#wage-list').innerHTML = list.map(w => {
    const paid = wagePaid(w);
    const abs = absCount(w);
    return '<div class="item-card" data-wage="' + w.id + '">'
      + '<div class="ic-main">'
      + '<div class="ic-title">' + esc(empName(w.employeeId)) + ' ' + stLabel(wageStatus(w)) + '</div>'
      + '<div class="ic-sub">' + esc(w.period) + ' · ' + (abs === 0 ? '全勤' : '缺勤 ' + abs + ' 天') + '</div>'
      + '</div>'
      + '<div class="ic-right"><div class="ic-amt">' + fmtInt(w.amount) + ' 元</div><div class="ic-sub2">' + (wageStatus(w) === 'pending' ? '未发放' : '已发 ' + fmtInt(paid)) + '</div></div>'
      + '</div>';
  }).join('') || '<div class="empty" style="padding:18px;text-align:center;color:var(--muted)">暂无工资单</div>';
}

let currentWageId = null;
function openWageModal(wid) {
  const w = S.wages.find(x => x.id === wid);
  if (!w) return;
  currentWageId = wid;
  const [y, m] = w.period.split('-').map(Number);
  const firstWeekday = new Date(y, m - 1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const absSet = new Set(w.absenceDates || []);
  const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
  let calCells = weekNames.map(n => '<div class="cal-head">' + n + '</div>').join('');
  for (let i = 0; i < firstWeekday; i++) calCells += '<div class="cal-day empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = w.period + '-' + String(d).padStart(2, '0');
    calCells += '<button class="cal-day' + (absSet.has(dateStr) ? ' selected' : '') + '" data-abs-day="' + d + '">' + d + '</button>';
  }
  const pad = (7 - ((firstWeekday + daysInMonth) % 7)) % 7;
  for (let i = 0; i < pad; i++) calCells += '<div class="cal-day empty"></div>';
  const total = Number(w.amount) || 0;
  const paid = wagePaid(w);
  const remain = Math.max(0, total - paid);
  const st = wageStatus(w);
  const stBadge = st === 'paid' ? '<span class="badge badge-ok">已发</span>' : st === 'partial' ? '<span class="badge badge-info">部分发放</span>' : '<span class="badge badge-gray">待发</span>';
  // 发放记录列表
  const payments = (w.payments || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const payListHtml = payments.length
    ? payments.map(p => '<tr><td>' + esc(p.date) + '</td><td>' + fmtInt(p.amount) + '</td><td>' + esc(p.note || '—') + '</td><td><button class="link-btn danger" data-del-wage-pay="' + p.id + '">删除</button></td></tr>').join('')
    : '<tr><td colspan="4" class="empty">暂无发放记录</td></tr>';
  const addBtnDisabled = (remain <= 0 && total > 0) ? ' disabled' : '';
  const addBtnText = st === 'paid' ? '工资已全额发放' : (remain > 0 ? '登记发放' : '登记发放');
  const remainderHint = st === 'paid'
    ? '<div class="kv"><span>已全额发放</span><b>' + fmtInt(paid) + '</b></div>'
    : '<div class="kv"><span>已发放</span><b>' + fmtInt(paid) + '</b></div>'
      + (total > 0 ? '<div class="kv"><span>剩余待发</span><b>' + fmtInt(remain) + '</b></div>' : '');
  const addPayHtml = (total <= 0)
    ? '<p class="muted" style="font-size:12px">先补全工资金额后再登记发放。</p>'
    : '<div class="form-grid" style="margin-top:10px">'
      + '<label>发放金额 <input type="number" id="wage-pay-amount" min="0" step="1" inputmode="numeric" value="' + (remain > 0 ? remain : '') + '" placeholder="留空等于剩余待发"></label>'
      + '<label>发放日期 <input type="date" id="wage-pay-date" value="' + todayStr() + '"></label>'
      + '<label class="span2">备注（如：预支、现金、微信）<input type="text" id="wage-pay-note" placeholder="可留空"></label>'
      + '</div>'
      + '<button class="primary" id="btn-wage-pay-add"' + addBtnDisabled + '>' + addBtnText + '</button>';
  $('#modal').innerHTML =
    '<div class="modal-head"><h2>' + esc(empName(w.employeeId)) + ' · ' + esc(w.period) + ' 工资</h2><button class="modal-x" data-close>&times;</button></div>'
    + '<div class="kv"><span>工资金额</span><input type="number" id="wage-amount-edit" value="' + w.amount + '" min="0" step="1" style="width:120px"> <button class="ghost small" id="btn-wage-amount-save">保存</button></div>'
    + '<div class="kv"><span>状态</span><b>' + stBadge + '</b></div>'
    + remainderHint
    + '<div class="kv"><span>缺勤天数</span><b>' + absSet.size + ' 天</b></div>'
    + '<div class="kv" style="display:block"><span>缺勤日期（点击日期切换，红色为缺勤）</span>'
    + '<div class="cal-grid" id="wage-abs-cal">' + calCells + '</div></div>'
    + '<div style="border-top:1px solid var(--border);margin:12px 0"></div>'
    + '<div class="sub-title">发放记录</div>'
    + '<table style="width:100%;margin:6px 0"><thead><tr><th style="text-align:left">日期</th><th style="text-align:left">金额</th><th style="text-align:left">备注</th><th></th></tr></thead><tbody>' + payListHtml + '</tbody></table>'
    + addPayHtml
    + '<div style="margin-top:10px"><button class="ghost" id="btn-wage-del">删除工资单</button></div>';
  $('#modal-mask').classList.remove('hidden');
}

$('#report-all').addEventListener('change', e => { $('#report-month').disabled = e.target.checked; });

$('#btn-export-xlsx').addEventListener('click', () => {
  if (typeof XLSX === 'undefined') { alert('Excel 组件未加载，请检查本文件是否完整'); return; }
  const all = $('#report-all').checked;
  const m = $('#report-month').value;
  const inMonth = d => all || !m || (d || '').indexOf(m) === 0;
  const billInMonth = b => all || !m || b.period === m;
  const label = all ? '全部' : (m || '全部');

  const wb = XLSX.utils.book_new();

  // 工作表1：收支明细
  const r1 = [['日期', '收支', '类别', '客户', '收入(元)', '支出(元)', '备注']];
  S.incomes.filter(i => inMonth(i.date)).forEach(i => r1.push([i.date, '收入', i.type || '进仓费', custName(i.customerId), Number(i.amount), '', i.note || '']));
  S.expenses.filter(e2 => inMonth(e2.date)).forEach(e2 => r1.push([e2.date, '支出', catLabel(e2), '', '', Number(e2.amount), e2.note || '']));
  const ws1 = XLSX.utils.aoa_to_sheet([r1[0]].concat(r1.slice(1).sort((a, b) => a[0].localeCompare(b[0]))));
  ws1['!cols'] = [{ wch: 12 }, { wch: 6 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 28 }];
  XLSX.utils.book_append_sheet(wb, ws1, '收支明细');

  // 工作表2：应收台账
  const r2 = [['客户', '账期', '账单金额(元)', '已收(元)', '未收(元)', '收款状态', '开票状态']];
  S.bills.filter(billInMonth).sort((a, b) => a.period.localeCompare(b.period)).forEach(b => {
    const st = billState(b);
    r2.push([custName(b.customerId), b.period, Number(b.amount), st.paid, st.remaining, st.label, invState(b).label]);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(r2);
  ws2['!cols'] = [{ wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, ws2, '应收台账');

  // 工作表3：收款记录
  const r3 = [['日期', '客户', '账期', '金额(元)', '备注']];
  S.payments.filter(p => inMonth(p.date)).sort((a, b) => a.date.localeCompare(b.date)).forEach(p => {
    const b = S.bills.find(x => x.id === p.billId);
    r3.push([p.date, b ? custName(b.customerId) : '', b ? b.period : '', Number(p.amount), p.note || '']);
  });
  const ws3 = XLSX.utils.aoa_to_sheet(r3);
  ws3['!cols'] = [{ wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 24 }];
  XLSX.utils.book_append_sheet(wb, ws3, '收款记录');

  // 工作表4：发票台账
  const r4 = [['开票日期', '客户', '账期', '开票金额(元)', '账单金额(元)']];
  S.invoices.filter(i => inMonth(i.date)).sort((a, b) => a.date.localeCompare(b.date)).forEach(i => {
    const b = S.bills.find(x => x.id === i.billId);
    r4.push([i.date || '', b ? custName(b.customerId) : '', b ? b.period : '', Number(i.amount) > 0 ? Number(i.amount) : (b ? Number(b.amount) : ''), b ? Number(b.amount) : '']);
  });
  const ws4 = XLSX.utils.aoa_to_sheet(r4);
  ws4['!cols'] = [{ wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws4, '发票台账');

  // 工作表5：工资表
  const r5 = [['月份', '员工', '金额(元)', '已发放(元)', '剩余(元)', '缺勤(天)', '状态']];
  S.wages.filter(w => all || !m || w.period === m)
    .sort((a, b) => a.period.localeCompare(b.period) || empName(a.employeeId).localeCompare(empName(b.employeeId), 'zh'))
    .forEach(w => {
      const st = wageStatus(w);
      r5.push([w.period, empName(w.employeeId), Math.round(Number(w.amount) || 0), Math.round(wagePaid(w)), Math.max(0, Math.round(Number(w.amount) || 0) - Math.round(wagePaid(w))), absCount(w), st === 'paid' ? '已发' : st === 'partial' ? '部分发放' : '待发']);
    });
  const ws5 = XLSX.utils.aoa_to_sheet(r5);
  ws5['!cols'] = [{ wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 8 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, ws5, '工资表');

  XLSX.writeFile(wb, '账本报表_' + label + '.xlsx');
  toast('Excel 已导出');
});

/* ---------- 备份与恢复 ---------- */
$('#btn-backup').addEventListener('click', () => {
  const data = {
    app: 'company-ledger', version: 1, exportedAt: new Date().toISOString(),
    customers: S.customers, incomes: S.incomes, expenses: S.expenses,
    bills: S.bills, payments: S.payments, invoices: S.invoices,
    employees: S.employees, wages: S.wages,
    settings: S.settings
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '账本备份_' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('备份文件已下载');
});

$('#btn-restore').addEventListener('click', () => $('#restore-file').click());
$('#restore-file').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) importBackup(f);
});
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (err) { alert('备份文件格式不对'); return; }
  if (!data || data.app !== 'company-ledger' || !Array.isArray(data.customers)) { alert('这不是本软件的备份文件'); return; }
  if (!confirm('导入备份将覆盖当前浏览器中的全部账本数据，确定继续吗？')) return;
  for (const s of STORES) await dbClear(s);
  for (const c of data.customers || []) await dbPut('customers', c);
  for (const i of data.incomes || []) await dbPut('incomes', i);
  for (const e2 of data.expenses || []) await dbPut('expenses', e2);
  for (const b of data.bills || []) await dbPut('bills', b);
  for (const p of data.payments || []) await dbPut('payments', p);
  for (const iv of data.invoices || []) await dbPut('invoices', iv);
  for (const em of data.employees || []) await dbPut('employees', em);
  for (const wg of data.wages || []) await dbPut('wages', wg);
  for (const p of data.purchases || []) { /* 采购功能已删除 */ }
  // 报销功能已并入支出（车队分类），旧报销数据不再导入
  const st = data.settings || {};
  for (const k of Object.keys(st)) await dbPut('meta', { id: k, value: st[k] });
  await loadState();
  renderPage(currentPage);
  toast('备份已恢复');
}

/* ---------- 初始化 ---------- */
(async function init() {
  try {
    await openDB();
  } catch (err) {
    return;
  }
  await loadState();
  await migrateCategories();
  if (!S.settings.seeded) {
    for (const n of ['祺盾', '孙海洋', '陈武', '傲通']) {
      await dbPut('customers', { id: uid(), name: n, createdAt: Date.now() });
    }
    await saveSetting('seeded', true);
    await loadState();
  }
  $('#report-month').value = monthStr();
  if ($('#tx-date')) $('#tx-date').value = todayStr();
  $('#wage-period').value = monthStr();
  renderUnpaid();
})();
</script>
